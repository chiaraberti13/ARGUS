[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghosttrack"
version = "3.0.0"
description = "Improved cross-platform OSINT & information-gathering toolkit (IP, phone, username, email)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "GhostTrack contributors" }]
keywords = ["osint", "security", "recon", "information-gathering", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.31.0",
    "phonenumbers>=8.13.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dns = ["dnspython>=2.4.0"]
dev = ["pytest>=7.0", "pytest-mock>=3.10", "ruff>=0.1.0"]

[project.urls]
Homepage = "https://github.com/HunxByts/GhostTrack"

[project.scripts]
ghosttrack = "ghosttrack.cli:main"

[tool.setuptools]
packages = ["ghosttrack", "ghosttrack.modules"]

[tool.setuptools.package-data]
ghosttrack = ["../data/sites.json"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.pytest.ini_options]
testpaths = ["tests"]
